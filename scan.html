<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Ticket QR Code</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="scan-page">
  <div class="status-bar">
    <div class="left">3:44PM&nbsp;&nbsp;&nbsp;Fri May 15</div>
    <div class="right">
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
      <span>5G</span>
      <span aria-hidden="true">&#9790;</span>
      <span>86%</span>
      <span class="battery-icon"><span class="battery-fill"></span></span>
    </div>
  </div>

  <header class="scan-head">
    <a href="events.html" class="left" aria-label="Close">&times;</a>
    <h1>Scan Ticket QR Code</h1>
    <button class="right" aria-label="Toggle flash">&#9889;</button>
  </header>

  <div class="scan-body">
    <div class="scan-frame">
      <span class="bl"></span><span class="br"></span>
    </div>
    <p class="scan-hint">Position the QR code within the frame</p>
    <a href="#" class="scan-manual">ENTER MANUALLY</a>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
