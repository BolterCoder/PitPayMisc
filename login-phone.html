<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Your Mobile Number - Ticket Hoss</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="status-bar">
    <div class="left">3:41PM&nbsp;&nbsp;&nbsp;Fri May 15</div>
    <div class="right">
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
      <span>5G</span>
      <span aria-hidden="true">&#9790;</span>
      <span>87%</span>
      <span class="battery-icon"><span class="battery-fill"></span></span>
    </div>
  </div>

  <nav class="app-nav">
    <a href="index.html"><span>&larr;</span> Switch App</a>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="hoss-logo">
          <div class="ticket">TICKET</div>
          <div class="hoss">HOSS</div>
          <div class="powered">powered by PitPay</div>
        </div>
      </div>

      <h1 class="auth-title">Enter Your Mobile<br>Number</h1>
      <p class="auth-sub">You will receive a one time password via text message</p>

      <form action="login-otp.html" method="get" class="phone-form">
        <div class="phone-input">
          <span class="flag">&#127482;&#127480;</span>
          <span class="caret">&#9662;</span>
          <input type="tel" value="(704) 791-9020" aria-label="Mobile number">
        </div>
        <button type="submit" class="btn btn-block">Continue <span class="arrow">&rarr;</span></button>
        <div class="auth-foot"><a href="#">Having Trouble?</a></div>
      </form>
    </div>
  </main>

  <div class="home-indicator"></div>
</body>
</html>
