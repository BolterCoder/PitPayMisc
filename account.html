<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="status-bar">
    <div class="left">4:00PM&nbsp;&nbsp;&nbsp;Fri May 15</div>
    <div class="right">
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
      <span>5G</span>
      <span aria-hidden="true">&#9790;</span>
      <span>76%</span>
      <span class="battery-icon"><span class="battery-fill"></span></span>
    </div>
  </div>

  <header class="dash-header">
    <button class="menu-btn" aria-label="Menu">&#9776;</button>
    <h1>Account</h1>
  </header>

  <main class="account-page">
    <div class="session-card">
      <span class="badge">Active Session</span>
      <div class="duration">
        <div class="big">17m</div>
        <div class="lbl">session duration</div>
      </div>
      <div class="session-meta">
        <span>Started 3:42 PM</span>
        <span>Role: admin</span>
      </div>
    </div>

    <div class="user-card">
      <div class="initials">FB</div>
      <div>
        <strong>Frank Bolter</strong>
        <span>Frank@PitPay.com &middot; +17047919020</span>
      </div>
    </div>

    <div class="switch-card">
      <h3>Switch Account</h3>
      <div class="account-row">
        <div class="avatar">HS</div>
        <div class="name">Hunt The Front Super Dirt Series</div>
      </div>
      <div class="account-row active">
        <div class="avatar">HR</div>
        <div class="name">Hunt The Front's Southern Raceway</div>
        <div class="check">&#10003;</div>
      </div>
      <div class="account-row">
        <div class="avatar">ES</div>
        <div class="name">ELKO! Speedway</div>
      </div>
    </div>

    <div class="setting-row">
      <span class="ico" aria-hidden="true">&#9790;</span>
      <span class="label">Dark Mode</span>
      <span class="big-toggle on" role="switch" aria-checked="true"></span>
    </div>

    <a class="setting-row" href="#" style="text-decoration:none;color:inherit">
      <span class="ico" aria-hidden="true">&#128737;</span>
      <span class="label">Privacy Policy</span>
      <span class="chev">&rsaquo;</span>
    </a>

    <a href="index.html" class="logout-big">LOG OUT</a>
  </main>

  <div class="home-indicator"></div>
</body>
</html>
