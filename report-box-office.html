<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Office Report</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="status-bar">
    <div class="left">3:50PM&nbsp;&nbsp;&nbsp;Fri May 15</div>
    <div class="right">
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
      <span>5G</span>
      <span aria-hidden="true">&#9790;</span>
      <span>83%</span>
      <span class="battery-icon"><span class="battery-fill"></span></span>
    </div>
  </div>

  <header class="pos-page-head">
    <a class="pos-back" href="reports.html" aria-label="Back">&larr;</a>
    <h1>Box Office Report</h1>
  </header>

  <main class="box-report">
    <div class="report-event-card">
      <h2>USCS Sprint Cars</h2>
      <p>Hunt the Front's Southern Raceway<br>Cashier: Bolter, Frank</p>
    </div>

    <div class="payment-summary">
      <h3>Payment Summary</h3>

      <div class="summary-stats">
        <div class="summary-stat cash">
          <div class="label">Cash</div>
          <div class="val">$0.00</div>
        </div>
        <div class="summary-stat card">
          <div class="label">Card</div>
          <div class="val">$0.00</div>
        </div>
        <div class="summary-stat revenue">
          <div class="label">Total Revenue</div>
          <div class="val">$0.00</div>
        </div>
      </div>

      <div class="summary-counts">
        <div>
          <div class="num">0</div>
          <div class="label">Transactions</div>
        </div>
        <div>
          <div class="num">0</div>
          <div class="label">Tickets Sold</div>
        </div>
      </div>
    </div>
  </main>

  <div class="print-bar">
    <button class="print-btn">&#128424; PRINT REPORT</button>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
