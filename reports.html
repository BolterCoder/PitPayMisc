<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="status-bar">
    <div class="left">3:49PM&nbsp;&nbsp;&nbsp;Fri May 15</div>
    <div class="right">
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
      <span>5G</span>
      <span aria-hidden="true">&#9790;</span>
      <span>83%</span>
      <span class="battery-icon"><span class="battery-fill"></span></span>
    </div>
  </div>

  <header class="dash-header">
    <button class="menu-btn" aria-label="Menu">&#9776;</button>
    <h1>Reports</h1>
  </header>

  <main class="reports-list">
    <a href="report-box-office.html" class="report-row">
      <div class="ico">&#129534;</div>
      <div class="meta">
        <strong>Box Office Report</strong>
        <span>Cash drawer totals and ticket breakdown</span>
      </div>
      <span class="chev">&rsaquo;</span>
    </a>

    <a href="report-pos-cash.html" class="report-row">
      <div class="ico">&#128181;</div>
      <div class="meta">
        <strong>POS Cash Report</strong>
        <span>Cash transaction history</span>
      </div>
      <span class="chev">&rsaquo;</span>
    </a>

    <a href="report-pos-card.html" class="report-row">
      <div class="ico">&#128179;</div>
      <div class="meta">
        <strong>POS Card Report</strong>
        <span>Card transaction history</span>
      </div>
      <span class="chev">&rsaquo;</span>
    </a>
  </main>

  <div class="home-indicator"></div>
</body>
</html>
