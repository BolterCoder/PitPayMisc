<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Ticket Hoss POS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="status-bar">
    <div class="left">3:49PM&nbsp;&nbsp;&nbsp;Fri May 15</div>
    <div class="right">
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
      <span>5G</span>
      <span aria-hidden="true">&#9790;</span>
      <span>83%</span>
      <span class="battery-icon"><span class="battery-fill"></span></span>
    </div>
  </div>

  <header class="dash-header">
    <button class="menu-btn" aria-label="Menu">&#9776;</button>
    <h1>Events</h1>
  </header>

  <section class="dash-grid" style="opacity:0.45">
    <div class="dash-main">
      <div class="section-label">NEXT UP</div>
      <div class="featured-card active">
        <div class="featured-active-head">
          <h2>USCS Sprint Cars</h2>
          <span class="upcoming-pill">&#128197; Upcoming</span>
        </div>
        <div class="featured-active-date"><span class="clock"></span> Friday, May 15</div>
        <div class="stats-row">
          <div class="stat"><div class="num">55</div><div class="label">Tickets Sold</div></div>
          <div class="stat"><div class="num accent">0</div><div class="label">Checked In</div></div>
          <div class="stat"><div class="num">55</div><div class="label">Remaining</div></div>
        </div>
        <div class="featured-actions active">
          <button class="action-btn">&#128722; SELL</button>
          <button class="action-btn">&#8599; MANAGE</button>
          <button class="action-btn disabled">&#9783; SCAN</button>
        </div>
      </div>
    </div>
    <aside></aside>
  </section>

  <div class="drawer-wrap">
    <aside class="drawer dark">
      <div class="drawer-logo">
        <div class="hoss-logo">
          <div class="ticket">TICKET</div>
          <div class="hoss">HOSS</div>
          <div class="powered">powered by PitPay</div>
        </div>
      </div>

      <div class="drawer-name">Frank Bolter</div>
      <div class="drawer-select">
        <span>Hunt The Front's Souther...</span>
        <span>&#9662;</span>
      </div>

      <div class="drawer-sep"></div>

      <a class="drawer-link active" href="events.html">Events</a>
      <a class="drawer-link" href="reports.html">Reports</a>
      <a class="drawer-link" href="report-pos-card.html">Transactions</a>
      <a class="drawer-link" href="#">Settings</a>
      <a class="drawer-link" href="#">Account</a>

      <div class="drawer-foot">
        <div class="theme-toggle">
          <span aria-hidden="true">&#9790;</span>
          <span class="toggle-track" role="switch" aria-checked="true"></span>
        </div>
        <button class="switch-btn">&#8646; Switch</button>
        <a href="index.html" class="logout-btn">&#8629; Log Out</a>
      </div>
    </aside>
    <a href="events.html" class="drawer-scrim" aria-label="Close"></a>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
